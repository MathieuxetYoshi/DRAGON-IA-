services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dragon
      POSTGRES_USER: dragon
      POSTGRES_PASSWORD: dragon_local_only
    ports:
      - "5432:5432"
    volumes:
      - dragon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dragon -d dragon"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - dragon_redis:/data

volumes:
  dragon_pg:
  dragon_redis:
